<!DOCTYPE html>
<!-- バッチ24（2026-11-11 CEO指示）: 事務所の工具端末（Androidタブレット）専用画面。
     工具の持出・返却だけができる。LINEログインせず、工具端末キー（?kk=・初回に端末へ保存）で認証。
     ポータルの他の画面へは移れない（リンク・メニューなし／キーでは工具以外のAPIが拒否される）。 -->
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f2b52">
<title>工具 持出・返却</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:"Noto Sans JP","Yu Gothic","Hiragino Sans","Meiryo",sans-serif; -webkit-tap-highlight-color:transparent; }
body { background:#f4f5f7; min-height:100vh; user-select:none; -webkit-user-select:none; }
.top { background:#1565c0; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:10; }
.top h1 { font-size:22px; }
.top .sub { font-size:14px; color:#cfe2fa; }
.top .end { margin-left:auto; background:#fff; color:#1565c0; border:none; border-radius:10px; padding:12px 26px; font-size:18px; font-weight:bold; }
.wrap { padding:16px 20px 120px; }
.lead { font-size:20px; font-weight:bold; color:#0f2b52; margin:6px 0 14px; }
.names { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
.name-btn { background:#fff; border:2px solid #1565c0; color:#1565c0; border-radius:14px; padding:22px 8px; font-size:22px; font-weight:bold; }
.name-btn:active { background:#e3eefb; }
.summary { margin-top:22px; font-size:15px; color:#667; }
.sec { font-size:17px; font-weight:bold; color:#0f2b52; margin:22px 0 10px; }
.genba-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.12); }
.genba-row label { font-size:17px; font-weight:bold; color:#0f2b52; }
#genba { flex:1; min-width:260px; font-size:20px; padding:12px; border:2px solid #c5d0db; border-radius:10px; user-select:text; -webkit-user-select:text; }
#genba.need { border-color:#c0392b; background:#fff4f2; }
.chips { display:flex; gap:8px; flex-wrap:wrap; width:100%; }
.chip { background:#eef3f9; border:1px solid #c5d0db; border-radius:20px; padding:9px 16px; font-size:15px; color:#0f2b52; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
.card { background:#fff; border-radius:14px; padding:14px 12px; box-shadow:0 1px 3px rgba(0,0,0,.12); border:3px solid transparent; display:flex; flex-direction:column; gap:8px; }
.card.out { background:#fdf8ef; }
.card.busy { opacity:.5; }
.card .nm { font-size:19px; font-weight:bold; color:#1565c0; }
.card .meta { font-size:13px; color:#8895a2; min-height:18px; }
.act { border:none; border-radius:10px; padding:16px 6px; font-size:19px; font-weight:bold; color:#fff; }
.act.take { background:#e8a33d; }
.act.back { background:#2e7d32; }
.banner { position:fixed; left:0; right:0; bottom:0; background:#0f2b52; color:#fff; padding:16px 20px; display:none; align-items:center; gap:16px; z-index:20; font-size:20px; box-shadow:0 -2px 10px rgba(0,0,0,.25); }
.banner.err { background:#c0392b; }
.banner .msg { flex:1; font-weight:bold; }
.banner button { background:#fff; color:#c0392b; border:none; border-radius:10px; padding:12px 20px; font-size:17px; font-weight:bold; }
.empty { padding:40px; text-align:center; color:#667; font-size:18px; }
</style></head>
<body>
<div class="top">
  <div><h1 id="title">🛠 工具 持出・返却</h1><div class="sub" id="subtitle">名前をタップしてから工具を選んでください</div></div>
  <button class="end" id="endBtn" style="display:none" onclick="endSession()">終わる</button>
</div>
<div class="wrap" id="view"><div class="empty">読み込み中...</div></div>
<div class="banner" id="banner"><div class="msg" id="bannerMsg"></div><button id="bannerUndo" style="display:none">↩ 取消</button></div>

<script>
var GAS_EXEC = 'https://script.google.com/macros/s/AKfycbzFwwNdEKECKH1cKyDy6-JBCwmulqsdHufYrm01bDJsk3aKoWLGW_8Bed2WCmlQCtS6/exec'; // index.htmlと同じJSON API
var IDLE_SEC = 60;          // 触らずにこの秒数たつと名前の選択を解除して最初の画面に戻る
var KEY = '';               // 工具端末キー（?kk= で受け取り端末に保存）
var D = null;               // api_koguKioskGet の応答
var PERSON = '';            // 選択中の名前
var GENBA = '';             // 持出先の現場（名前の選択ごとに空にする）
var busyTool = {};          // 送信中の工具（二重タップ防止）
var idleTm = null, bannerTm = null;

(function initKey() {
  var qs = new URLSearchParams(location.search);
  try {
    if (qs.get('kk')) localStorage.setItem('koguKioskKey', qs.get('kk'));
    KEY = localStorage.getItem('koguKioskKey') || '';
  } catch (e) { KEY = qs.get('kk') || ''; }
  // 画面のURL欄にキーを残さない
  if (qs.get('kk') && history.replaceState) history.replaceState(null, '', location.pathname);
})();

function gasCall(fn, args, onOk, onErr) {
  fetch(GAS_EXEC, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ fn: fn, args: args || [] }),
  }).then(function(res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function(j) {
    if (!j || j.ok !== true) throw new Error((j && j.error) || '不明なエラー');
    setTimeout(function() { onOk && onOk(j.result); }, 0);
  }).catch(function(e) {
    var err = (e && e.message) ? e : new Error('通信に失敗しました');
    setTimeout(function() { onErr && onErr(err); }, 0);
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function jsArg(s) { return esc(JSON.stringify(String(s))); }

function load(cb) {
  if (!KEY) { document.getElementById('view').innerHTML = '<div class="empty">この端末は工具端末として設定されていません。<br>管理者に設定用のURLで開いてもらってください。</div>'; return; }
  gasCall('api_koguKioskGet', [KEY],
    function(r) {
      D = r;
      // 現場を入力中は描き直さない（キーボードが閉じるため）。データは更新済みなので次の操作で反映される
      var a = document.activeElement;
      if (a && a.id === 'genba') return;
      cb ? cb() : render();
    },
    function(e) {
      document.getElementById('view').innerHTML = '<div class="empty">読み込めませんでした: ' + esc(e.message) +
        '<br><br><button class="name-btn" onclick="load()">もう一度読み込む</button></div>';
    });
}

function render() {
  if (!D) return;
  var outs = D.tools.filter(function(t) { return t.state === '持出中'; });
  document.getElementById('endBtn').style.display = PERSON ? '' : 'none';
  if (!PERSON) {
    document.getElementById('title').textContent = '🛠 工具 持出・返却';
    document.getElementById('subtitle').textContent = '名前をタップしてから工具を選んでください';
    document.getElementById('view').innerHTML =
      '<div class="lead">👤 あなたの名前をタップ</div>' +
      (D.names.length ? '<div class="names">' + D.names.map(function(n) {
        return '<button class="name-btn" onclick="pick(' + jsArg(n) + ')">' + esc(n) + '</button>';
      }).join('') + '</div>' : '<div class="empty">名前の候補がありません（ポータルのLINE紐付けで承認済みの社員が出ます）</div>') +
      '<div class="summary">いま持出中: ' + outs.length + '点 ／ 事務所: ' + (D.tools.length - outs.length) + '点</div>';
    return;
  }
  document.getElementById('title').textContent = '👤 ' + PERSON + ' さん';
  document.getElementById('subtitle').textContent = '工具をタップすると、すぐに記録されます。終わったら右の「終わる」';
  var mine = outs.filter(function(t) { return t.who === PERSON; });
  var others = D.tools.filter(function(t) { return t.who !== PERSON || t.state !== '持出中'; });
  var recent = recentGenba();
  var html = '';
  if (mine.length) {
    html += '<div class="sec">↩ あなたが持出中（返すときはタップ）</div><div class="grid">' + mine.map(card).join('') + '</div>';
  }
  html += '<div class="sec">📍 持出先の現場（持ち出す前に選ぶ）</div>' +
    '<div class="genba-row"><input id="genba" list="genbaDl" maxlength="60" placeholder="現場を選ぶか入力" value="' + esc(GENBA) + '" oninput="setGenba(this.value)">' +
    '<datalist id="genbaDl">' + (D.genba || []).map(function(g) { return '<option value="' + esc(g) + '">'; }).join('') + '</datalist>' +
    (recent.length ? '<div class="chips">' + recent.map(function(g) {
      return '<button class="chip" onclick="setGenba(' + jsArg(g) + ', true)">' + esc(g) + '</button>';
    }).join('') + '</div>' : '') + '</div>';
  html += '<div class="sec">🛠 工具（オレンジ＝持ち出す／緑＝返す）</div><div class="grid">' + others.map(card).join('') + '</div>';
  document.getElementById('view').innerHTML = html;
}

function card(t) {
  var out = t.state === '持出中';
  var meta = out ? '持出中: ' + esc(t.who) + (t.genba ? '［' + esc(t.genba) + '］' : '') : '事務所にあります';
  return '<div class="card' + (out ? ' out' : '') + (busyTool[t.name] ? ' busy' : '') + '">' +
    '<div class="nm">' + esc(t.name) + '</div><div class="meta">' + meta + '</div>' +
    '<button class="act ' + (out ? 'back' : 'take') + '" onclick="tap(' + jsArg(t.name) + ')">' + (out ? '返す' : '持ち出す') + '</button></div>';
}

function pick(n) {
  PERSON = n; GENBA = '';
  touch();
  load(); // 最新の状態を取り直してから表示
  render();
}

function endSession() {
  PERSON = ''; GENBA = '';
  clearTimeout(idleTm);
  hideBanner();
  render();
}

function touch() {
  clearTimeout(idleTm);
  if (PERSON) idleTm = setTimeout(endSession, IDLE_SEC * 1000);
}
document.addEventListener('pointerdown', touch, true);
document.addEventListener('keydown', touch, true);

function setGenba(v, redraw) {
  GENBA = String(v || '').trim();
  var inp = document.getElementById('genba');
  if (inp) { inp.classList.remove('need'); if (redraw) inp.value = GENBA; }
}

function recentGenba() {
  try { return JSON.parse(localStorage.getItem('koguKioskRecent') || '[]'); } catch (e) { return []; }
}
function rememberGenba(g) {
  var list = recentGenba().filter(function(x) { return x !== g; });
  list.unshift(g);
  try { localStorage.setItem('koguKioskRecent', JSON.stringify(list.slice(0, 6))); } catch (e) { /* 保存不可は無視 */ }
}

function tap(name) {
  if (!PERSON || busyTool[name]) return;
  var t = D.tools.filter(function(x) { return x.name === name; })[0];
  if (!t) return;
  var state = t.state === '持出中' ? '事務所' : '持出中';
  var g = state === '持出中' ? GENBA : '';
  if (state === '持出中' && !g) {
    var inp = document.getElementById('genba');
    if (inp) { inp.classList.add('need'); inp.scrollIntoView({ block: 'center' }); }
    showBanner('先に「持出先の現場」を選んでください', true);
    return;
  }
  var person = PERSON;
  busyTool[name] = true; render();
  gasCall('api_koguKioskSet', [KEY, person, name, state, g],
    function(r) {
      delete busyTool[name];
      if (g) rememberGenba(g);
      showBanner(person + ' さんが「' + name + '」を' + (state === '持出中' ? '持ち出しました［' + g + '］' : '返しました') + ' ✓',
        false, r && r.unchanged ? null : function() { undo(person, name); });
      load();
    },
    function(e) { delete busyTool[name]; showBanner('記録できませんでした: ' + e.message, true); load(); });
}

function undo(person, name) {
  gasCall('api_koguKioskUndo', [KEY, person, name],
    function() { showBanner('「' + name + '」の操作を取り消しました', false); load(); },
    function(e) { showBanner(e.message, true); load(); });
}

function showBanner(msg, isErr, onUndo) {
  var b = document.getElementById('banner');
  document.getElementById('bannerMsg').textContent = msg;
  b.className = 'banner' + (isErr ? ' err' : '');
  b.style.display = 'flex';
  var u = document.getElementById('bannerUndo');
  u.style.display = onUndo ? '' : 'none';
  u.onclick = onUndo ? function() { u.style.display = 'none'; onUndo(); } : null;
  clearTimeout(bannerTm);
  bannerTm = setTimeout(hideBanner, onUndo ? 15000 : 5000);
}
function hideBanner() { document.getElementById('banner').style.display = 'none'; }

// 名前を選んでいない間は5分ごとに最新の状態へ（他の端末・ポータルでの操作を反映）
setInterval(function() { if (!PERSON) load(); }, 5 * 60 * 1000);
// 画面を消さない（対応ブラウザのみ）
function keepAwake() { try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(function() {}); } catch (e) { /* 非対応は無視 */ } }
document.addEventListener('visibilitychange', function() { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();
load();
</script>
</body></html>
