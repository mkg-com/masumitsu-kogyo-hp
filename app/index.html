function zhSubmit() {
  if (!zhCase) { toast('現場を選択してください'); return; }
  var items = [];
  document.querySelectorAll('#zhRows .zh-row').forEach(function(row) {
    var h = row.querySelector('.zh-h'), q = row.querySelector('.zh-q'), u = row.querySelector('.zh-u');
    if (h && h.value.trim()) {
      items.push({ hinmoku: h.value.trim(), qty: q ? q.value.trim() : '', unit: u ? u.value.trim() : '' });
    }
  });
  if (!items.length) { toast('品目を1件以上入力してください'); return; }
  var memoEl = document.getElementById('zhMemo');
  var btn = document.getElementById('zhSendBtn');
  if (btn) btn.disabled = true;
  document.getElementById('busy').style.display = 'block';

  var fail = function(msg) {
    document.getElementById('busy').style.display = 'none';
    if (btn) btn.disabled = false;
    alert(msg || '送信に失敗しました');
    zhLoad();
  };
  var send = function(photos) {
    gasCall('api_addZairyoHokoku', [TOKEN, zhCase, zhWeek, items, memoEl ? memoEl.value : '', photos || []],
      function(r) {
        document.getElementById('busy').style.display = 'none';
        if (btn) btn.disabled = false;
        toast((r && r.added ? r.added : items.length) + '品目を報告しました' +
          (r && r.photos ? '（写真' + r.photos + '枚）' : ''));
        var rowsEl = document.getElementById('zhRows');
        if (rowsEl) { rowsEl.innerHTML = ''; zhAddRow(); zhAddRow(); zhAddRow(); }
        if (memoEl) memoEl.value = '';
        zhPhotos = [];
        zhDrawPhotoList();
        zhLoad();
      },
      function(e) { fail(e && e.message ? e.message : '送信に失敗しました'); });
  };

  if (zhPhotos.length) {
    readFilesB64(zhPhotos, function(out, failName) {
      if (!out) { fail('写真の読み込みに失敗しました: ' + (failName || '')); return; }
      send(out);
    });
  } else {
    send([]);
  }
}

/* =========================================================
   経費申請タブ（P3c・バッチ5で「経費報告」から改名＋領収書添付）
========================================================= */
var keihiReceipts = [];  // 添付予定の領収書File配列（送信/再描画でクリア）

function keihiFormHtml() {
  var d = new Date();
  var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  return '<div class="sec"><h4 style="font-size:11px;color:#8895a2;margin-bottom:6px">経費を申請する</h4>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' +
        '<input type="date" id="keihiDate" class="fsort" value="' + today + '">' +
        '<input type="number" id="keihiAmount" class="fsort" placeholder="金額（円）" style="width:110px">' +
        '<input id="keihiMemo" class="fsort" placeholder="内容（例: ガソリン代）" style="width:180px">' +
        '<input id="keihiGenba" class="fsort" placeholder="現場（任意）" style="width:140px">' +
        '<button class="btn save" id="keihiSendBtn" style="flex:none;padding:8px 18px" onclick="keihiSubmit()">申請</button>' +
      '</div>' +
      '<div style="margin-top:8px;max-width:420px">' +
        '<a class="addr-link" onclick="document.getElementById(\'keihiFileInput\').click()">📷 領収書を添付（画像・PDF・' + UP_MAX_FILES + '枚まで）</a>' +
        '<input type="file" id="keihiFileInput" accept="image/*,application/pdf,.pdf,.heic" multiple style="display:none" onchange="keihiFilesChanged(this)">' +
        '<div id="keihiFileList" style="margin-top:4px"></div>' +
      '</div>' +
      '<p style="font-size:10.5px;color:#8895a2;margin-top:6px">領収書は写真かPDFで添付してください（原本の保管は会社のルールに従ってください）。承認・振込の処理は会社側で行います。</p></div>';
}

function renderKeihi() {
  keihiReceipts = [];
  var el = document.getElementById('view');
  if (B.keihiAccess === 'admin') {
    // 管理者＝社員と同じ画面（フォーム＋自分の一覧）＋管理者用の全員一覧（CEO指示 2026-10-13）
    el.innerHTML = '<div class="tbl-wrap">' + keihiFormHtml() +
      '<div class="sec"><h4 style="font-size:11px;color:#8895a2;margin-bottom:6px">自分の申請一覧</h4>' +
        '<div id="keihiList"><div class="empty">読み込み中...</div></div></div>' +
      '<div class="sec"><h4 style="font-size:11px;color:#8895a2;margin-bottom:6px">【管理者】全員の申請一覧（状態変更は💼経費承認タブで）</h4>' +
        '<div id="keihiBody"><div class="empty">読み込み中...</div></div></div></div>';
    keihiLoadMine();
    run('api_getKeihiAdmin', [TOKEN], function(r) { if (V === 'keihi') drawKeihiAdmin(r); });
    return;
  }
  el.innerHTML =
    '<div class="tbl-wrap">' + keihiFormHtml() +
    '<div class="sec"><h4 style="font-size:11px;color:#8895a2;margin-bottom:6px">自分の申請一覧</h4>' +
      '<div id="keihiList"><div class="empty">読み込み中...</div></div></div>' +
    '</div>';
  keihiLoadMine();
}

/* ---- 経費申請: 領収書添付（バッチ5） ---- */
function keihiFilesChanged(input) {
  var files = Array.prototype.slice.call(input.files || []);
  for (var i = 0; i < files.length; i++) {
    if (keihiReceipts.length >= UP_MAX_FILES) { toast('領収書は' + UP_MAX_FILES + '枚までです'); break; }
    var err = upFileOk(files[i]);
    if (err) { toast(err); continue; }
    keihiReceipts.push(files[i]);
  }
  input.value = '';
  keihiDrawFileList();
}
function keihiRemoveFile(i) { keihiReceipts.splice(i, 1); keihiDrawFileList(); }
function keihiDrawFileList() {
  var el = document.getElementById('keihiFileList');
  if (el) el.innerHTML = upFileListHtml(keihiReceipts, 'keihiRemoveFile');
}

// 写真リンク列G（カンマ区切りURL）→ 📄1 📄2 ... のリンク列HTML
function keihiPhotoLinks(photo) {
  if (!photo) return '<span style="color:#99a">—</span>';
  return String(photo).split(',').map(function(u, i) {
    u = u.trim(); if (!u) return '';
    return '<a href="' + esc(u) + '" target="_blank" style="white-space:nowrap">📄' + (i + 1) + '</a>';
  }).filter(Boolean).join(' ');
}

function keihiStatusChip(status) {
  var color = { '確認中': '#a05a00;background:#fdf3e3', '承認': '#1a5ca0;background:#e8f3fe',
                '振込済': '#2e7d32;background:#e8f5e9', '差戻': '#a02020;background:#fde8e8',
                '取消': '#667;background:#eceff2' }[status] || '#667;background:#eceff2';
  return '<span style="font-size:10.5px;padding:1px 8px;border-radius:10px;white-space:nowrap;color:' + color + '">' + esc(status) + '</span>';
}

var keihiMine = []; // 自分の申請一覧（取消ボタンの行特定キー保持用・バッチ6）

function keihiLoadMine() {
  run('api_getMyKeihi', [TOKEN], function(r) {
    if (V !== 'keihi') return;
    var list = document.getElementById('keihiList');
    if (!list) return;
    if (!r || !r.ok) { list.innerHTML = '<div class="empty">' + esc((r && r.error) || 'エラー') + '</div>'; return; }
    if (!r.items || !r.items.length) { list.innerHTML = '<div class="empty">申請はまだありません</div>'; return; }
    keihiMine = r.items;
    var rows = r.items.map(function(it, i) {
      // 取消は「確認中」のみ（承認以降は会社に連絡・バッチ6）
      var cancelBtn = (it.status === '確認中' && it.key)
        ? '<a class="addr-link" style="color:#a02020;white-space:nowrap" onclick="keihiCancel(' + i + ')">🗑 取消</a>'
        : '';
      return '<tr><td>' + esc(it.date) + '</td><td style="text-align:right">' + Number(it.amount || 0).toLocaleString() + '円</td>' +
        '<td>' + esc(it.memo) + '</td><td>' + keihiPhotoLinks(it.photo) + '</td>' +
        '<td>' + keihiStatusChip(it.status) + '</td><td>' + esc(it.submitted) + '</td><td>' + cancelBtn + '</td></tr>';
    }).join('');
    list.innerHTML = '<table class="lt"><tr><th>日付</th><th>金額</th><th>内容</th><th>領収書</th><th>状態</th><th>提出日</th><th></th></tr>' + rows + '</table>';
  });
}

/* ---- 経費申請: 本人取消（バッチ6） ---- */
function keihiCancel(i) {
  var it = keihiMine[i];
  if (!it || !it.key) { toast('対象が特定できません。画面を更新してください'); return; }
  if (!confirm(it.date + ' ' + Number(it.amount || 0).toLocaleString() + '円「' + (it.memo || '') + '」の申請を取り消しますか？')) return;
  document.getElementById('busy').style.display = 'block';
  gasCall('api_cancelMyKeihi', [TOKEN, it.key],
    function(r) {
      document.getElementById('busy').style.display = 'none';
      toast('申請を取り消しました');
      keihiLoadMine();
    },
    function(e) {
      document.getElementById('busy').style.display = 'none';
      toast('エラー: ' + (e && e.message ? e.message : '取消に失敗しました'));
    });
}

function keihiSubmit() {
  var date = (document.getElementById('keihiDate') || {}).value || '';
  var amount = (document.getElementById('keihiAmount') || {}).value || '';
  var memo = (document.getElementById('keihiMemo') || {}).value || '';
  var genba = (document.getElementById('keihiGenba') || {}).value || '';
  if (!date || !amount) { toast('日付と金額を入力してください'); return; }
  var btn = document.getElementById('keihiSendBtn');
  if (btn) btn.disabled = true;
  document.getElementById('busy').style.display = 'block';

  var fail = function(msg) {
    document.getElementById('busy').style.display = 'none';
    if (btn) btn.disabled = false;
    toast('エラー: ' + (msg || '申請に失敗しました'));
  };
  var send = function(receipts) {
    gasCall('api_submitKeihi', [TOKEN, { date: date, amount: amount, memo: memo, genba: genba, receipts: receipts || [] }],
      function(r) {
        document.getElementById('busy').style.display = 'none';
        if (btn) btn.disabled = false;
        toast('経費を申請しました（状態: 確認中' + (receipts && receipts.length ? '・領収書' + receipts.length + '枚' : '') + '）');
        var a = document.getElementById('keihiAmount'); if (a) a.value = '';
        var m = document.getElementById('keihiMemo'); if (m) m.value = '';
        var g = document.getElementById('keihiGenba'); if (g) g.value = '';
        keihiReceipts = [];
        keihiDrawFileList();
        keihiLoadMine();
      },
      function(e) { fail(e && e.message ? e.message : '申請に失敗しました'); });
  };

  if (keihiReceipts.length) {
    readFilesB64(keihiReceipts, function(out, failName) {
      if (!out) { fail('領収書の読み込みに失敗しました: ' + (failName || '')); return; }
      send(out);
    });
  } else {
    send([]);
  }
}

function drawKeihiAdmin(r) {
  var body = document.getElementById('keihiBody');
  if (!body) return;
  if (!r || !r.ok) { body.innerHTML = '<div class="empty">' + esc((r && r.error) || 'エラー') + '</div>'; return; }
  var note = '<p style="font-size:11px;color:#8895a2;margin-bottom:8px">全員の申請一覧（閲覧のみ）。承認・振込済などの状態変更は「💼 経費承認」タブで行えます。</p>';
  if (!r.items || !r.items.length) { body.innerHTML = note + '<div class="empty">申請はまだありません</div>'; return; }
  var rows = r.items.map(function(it) {
    return '<tr><td>' + esc(it.submitted) + '</td><td><b>' + esc(it.name) + '</b></td><td>' + esc(it.date) + '</td>' +
      '<td style="text-align:right">' + Number(it.amount || 0).toLocaleString() + '円</td>' +
      '<td>' + esc(it.memo) + '</td><td>' + keihiPhotoLinks(it.photo) + '</td>' +
      '<td>' + keihiStatusChip(it.status) + '</td><td>' + esc(it.done) + '</td></tr>';
  }).join('');
  body.innerHTML = note + '<table class="lt"><tr><th>提出日</th><th>氏名</th><th>日付</th><th>金額</th><th>内容</th><th>領収書</th><th>状態</th><th>処理日</th></tr>' + rows + '</table>';
}

/* =========================================================
   経費承認タブ（管理者専用・2026-10-12夜 CEO指示）
   全申請一覧＋各行の状態変更。サーバ側 api_setKeihiStatus は
   ホワイトリスト（確認中/承認/振込済/差戻/取消）のみ受け付ける
========================================================= */
var keihiAdminCache = [];
var KEIHI_STATUS_LIST = ['確認中', '承認', '振込済', '差戻', '取消'];

function renderKeihiApproval() {
  var el = document.getElementById('view');
  el.innerHTML = '<div class="tbl-wrap" id="keihiAdmBody"><div class="empty">読み込み中...</div></div>';
  run('api_getKeihiAdmin', [TOKEN], function(r) { if (V === 'keihiadmin') drawKeihiApproval(r); });
}

function drawKeihiApproval(r) {
  var body = document.getElementById('keihiAdmBody');
  if (!body) return;
  if (!r || !r.ok) { body.innerHTML = '<div class="empty">' + esc((r && r.error) || 'エラー') + '</div>'; return; }
  keihiAdminCache = r.items || [];
  var note = '<p style="font-size:11px;color:#8895a2;margin-bottom:8px">状態を選んで「変更」を押すと経費精算シートに即反映されます。' +
    '残タスク連携（毎時）もそのまま追従します（確認中・承認=タスク化／振込済・差戻・取消=タスク削除）。</p>';
  if (!keihiAdminCache.length) { body.innerHTML = note + '<div class="empty">申請はまだありません</div>'; return; }
  var rows = keihiAdminCache.map(function(it, i) {
    var opts = KEIHI_STATUS_LIST.map(function(s) {
      return '<option' + (s === it.status ? ' selected' : '') + '>' + s + '</option>';
    }).join('');
    return '<tr><td>' + esc(it.submitted) + '</td><td><b>' + esc(it.name) + '</b></td><td>' + esc(it.date) + '</td>' +
      '<td style="text-align:right">' + Number(it.amount || 0).toLocaleString() + '円</td>' +
      '<td>' + esc(it.memo) + '</td><td>' + keihiPhotoLinks(it.photo) + '</td>' +
      '<td>' + keihiStatusChip(it.status) + '</td>' +
      '<td style="white-space:nowrap"><select class="fsort" id="ksSel_' + i + '">' + opts + '</select> ' +
      '<span class="chipbtn" onclick="keihiSetStatus(' + i + ')">変更</span></td></tr>';
  }).join('');
  body.innerHTML = note + '<table class="lt"><tr><th>提出日</th><th>氏名</th><th>日付</th><th>金額</th><th>内容</th><th>領収書</th><th>状態</th><th>状態変更</th></tr>' + rows + '</table>';
}

function keihiSetStatus(i) {
  var it = keihiAdminCache[i];
  if (!it) return;
  var sel = document.getElementById('ksSel_' + i);
  var st = sel ? sel.value : '';
  if (!st || st === it.status) { toast('状態が変わっていません'); return; }
  if (!window.confirm(it.name + ' ' + it.date + ' ' + Number(it.amount || 0).toLocaleString() + '円 を「' + st + '」に変更しますか？')) return;
  run('api_setKeihiStatus', [TOKEN, it.key, st], function(r) {
    if (r && r.ok === false) { toast('エラー: ' + (r.error || '変更できませんでした')); return; }
    toast('「' + st + '」に変更しました');
    renderKeihiApproval();
  });
}

/* =========================================================
   初期化
   - ?k あり: 従来どおり（LIFFは一切動かない）
   - ?k なし: まず空トークンで従来認証（Google管理者セッション）を試し、
     不許可なら LIFF_ID 設定時のみ LINEログインへフォールバック
========================================================= */
icons(); // トップバーの静的アイコンを初期反映（バッチ8）
run('api_bootstrap', [TOKEN], function(r) {
  if (r && r.authorized) { applyBootstrap(r); return; }
  if (!TOKEN && LIFF_ID) { startLiffFlow(); return; }
  B = r;
  showDenied();
});
</script>
