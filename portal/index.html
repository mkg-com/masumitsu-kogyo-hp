<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>増光ポータル</title>
<style>
  body { font-family: 'Yu Gothic', Meiryo, sans-serif; background: #f5f7fa; margin: 0;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { text-align: center; padding: 32px; }
  .spinner { width: 36px; height: 36px; border: 4px solid #d0d7e2; border-top-color: #06c755;
             border-radius: 50%; margin: 0 auto 16px; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 16px; color: #1a2b45; margin: 0 0 8px; }
  p  { font-size: 13px; color: #5a6b85; margin: 0; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="sp"></div>
  <h1>増光ポータル</h1>
  <p id="msg">LINE認証中です…</p>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function() {
  var LIFF_ID = '2011981643-GBX2hvdc';
  var GAS_EXEC = 'https://script.google.com/macros/s/AKfycbzFwwNdEKECKH1cKyDy6-JBCwmulqsdHufYrm01bDJsk3aKoWLGW_8Bed2WCmlQCtS6/exec';
  function fail(m) {
    document.getElementById('sp').style.display = 'none';
    document.getElementById('msg').textContent = m;
  }
  if (typeof liff === 'undefined') { fail('LINEの部品を読み込めませんでした。通信環境を確認して開き直してください。'); return; }
  liff.init({ liffId: LIFF_ID }).then(function() {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    var t = liff.getIDToken();
    if (!t) { fail('本人確認情報を取得できませんでした。一度閉じて、もう一度開いてください。'); return; }
    location.replace(GAS_EXEC + '?lt=' + encodeURIComponent(t));
  }).catch(function(e) {
    fail('LINE認証の初期化に失敗しました。一度閉じて、もう一度開いてください。(' + (e && e.message ? e.message : e) + ')');
  });
})();
</script>
</body>
</html>
